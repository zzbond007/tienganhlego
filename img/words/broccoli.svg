<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="broccoli-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8f1"/><stop offset="1" stop-color="#e3ebdc"/></linearGradient>
<linearGradient id="broccoli-stem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bbf5a"/><stop offset=".5" stop-color="#c8e39a"/><stop offset="1" stop-color="#6fa344"/></linearGradient>
<radialGradient id="broccoli-fl" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#5fae3c"/><stop offset=".7" stop-color="#2f7a24"/><stop offset="1" stop-color="#1d5216"/></radialGradient>
<radialGradient id="broccoli-sh"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<pattern id="broccoli-bud" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="3" fill="#1e5a17" opacity=".35"/><circle cx="3.5" cy="3.5" r="1.2" fill="#9bd06f" opacity=".5"/></pattern>
</defs>
<rect width="400" height="300" fill="url(#broccoli-bg)"/>
<rect y="240" width="400" height="60" fill="#d8ccb5"/>
<ellipse cx="200" cy="246" rx="120" ry="14" fill="url(#broccoli-sh)"/>
<!-- stems -->
<path d="M175 246 L182 160 L150 120 L162 112 L196 150 L206 108 L220 110 L214 156 L250 122 L260 132 L222 170 L226 246Z" fill="url(#broccoli-stem)" stroke="#5f8f3a" stroke-width="1.5"/>
