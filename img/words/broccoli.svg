<circle cx="164" cy="74" r="34" fill="url(#broccoli-fl)"/>
<circle cx="240" cy="74" r="34" fill="url(#broccoli-fl)"/>
<circle cx="200" cy="130" r="40" fill="url(#broccoli-fl)"/>
</g>
<g fill="url(#broccoli-bud)">
<circle cx="132" cy="112" r="48"/><circle cx="268" cy="114" r="48"/><circle cx="200" cy="80" r="56"/>
<circle cx="164" cy="74" r="34"/><circle cx="240" cy="74" r="34"/><circle cx="200" cy="130" r="40"/>
</g>
