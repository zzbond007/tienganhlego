<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="towel-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6f8"/><stop offset="1" stop-color="#dbe8ec"/></linearGradient>
<linearGradient id="towel-cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8fbf"/><stop offset=".2" stop-color="#55b2de"/><stop offset=".5" stop-color="#6fc3ea"/><stop offset=".8" stop-color="#4aa8d6"/><stop offset="1" stop-color="#2a7fac"/></linearGradient>
<linearGradient id="towel-fold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6f98"/><stop offset="1" stop-color="#4aa8d6"/></linearGradient>
<linearGradient id="towel-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset=".5" stop-color="#a9b0b6"/><stop offset="1" stop-color="#6e767c"/></linearGradient>
<pattern id="towel-terry" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#fff" opacity=".12"/></pattern>
</defs>
<rect width="400" height="300" fill="url(#towel-bg)"/>
<g fill="#cfdde2"><rect x="0" y="0" width="400" height="300" fill="none"/></g>
<!-- bar mounts -->
<rect x="70" y="54" width="14" height="30" rx="4" fill="url(#towel-bar)"/><rect x="316" y="54" width="14" height="30" rx="4" fill="url(#towel-bar)"/>
<!-- back layer -->
<path d="M100 70 L300 70 L300 240 L100 240Z" fill="url(#towel-fold)"/>
<!-- front hanging layer -->
<path d="M96 76 L304 76 Q306 160 300 262 L100 262 Q94 160 96 76Z" fill="url(#towel-cloth)"/>
<path d="M96 76 L304 76 Q306 160 300 262 L100 262 Q94 160 96 76Z" fill="url(#towel-terry)"/>
<!-- stripe band -->
<rect x="98" y="214" width="204" height="10" fill="#fff" opacity=".85"/>
<rect x="98" y="230" width="204" height="5" fill="#fff" opacity=".85"/>
<!-- fringe/hem -->
<path d="M100 254 L300 254" stroke="#2a7fac" stroke-width="3"/>
<!-- bar over towel -->
<rect x="76" y="64" width="248" height="14" rx="7" fill="url(#towel-bar)"/>
<path d="M120 90 Q116 170 122 250" stroke="#1f6f98" stroke-width="5" fill="none" opacity=".35"/>
<path d="M270 90 Q276 170 272 250" stroke="#bfe6f8" stroke-width="5" fill="none" opacity=".35"/>
<ellipse cx="200" cy="284" rx="0" ry="0"/>
</svg>
