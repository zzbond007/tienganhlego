<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="scissors-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ee"/><stop offset="1" stop-color="#e6e0d6"/></linearGradient>
<linearGradient id="scissors-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9cfd6"/><stop offset=".55" stop-color="#9aa3ad"/><stop offset="1" stop-color="#e3e7eb"/></linearGradient>
<linearGradient id="scissors-hand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".6" stop-color="#e2452b"/><stop offset="1" stop-color="#a82a16"/></linearGradient>
<radialGradient id="scissors-sh"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="300" fill="url(#scissors-bg)"/>
<ellipse cx="205" cy="240" rx="165" ry="18" fill="url(#scissors-sh)"/>
<!-- lower blade (behind) -->
<g transform="rotate(22 200 160)">
<path d="M196 152 L370 156 Q378 160 370 164 L196 172Z" fill="url(#scissors-blade)" stroke="#7d868f" stroke-width="1.2"/>
<g transform="translate(0 0)">
<path d="M196 152 L160 154 Q140 156 128 162 L196 172Z" fill="url(#scissors-hand)"/>
<ellipse cx="96" cy="176" rx="44" ry="28" fill="url(#scissors-hand)"/>
<ellipse cx="96" cy="176" rx="30" ry="15" fill="#f6f1ea"/>
<ellipse cx="88" cy="160" rx="18" ry="5" fill="#fff" opacity=".35"/>
</g>
</g>
<!-- upper blade -->
<g transform="rotate(-22 200 160)">
<path d="M196 148 L370 156 Q378 160 370 162 L196 168Z" fill="url(#scissors-blade)" stroke="#7d868f" stroke-width="1.2"/>
<path d="M210 156 L360 159" stroke="#fff" stroke-width="2" opacity=".8"/>
<path d="M196 148 L160 150 Q140 152 128 158 L196 168Z" fill="url(#scissors-hand)"/>
<ellipse cx="96" cy="146" rx="44" ry="28" fill="url(#scissors-hand)"/>
<ellipse cx="96" cy="146" rx="30" ry="15" fill="#f6f1ea"/>
<ellipse cx="88" cy="130" rx="18" ry="5" fill="#fff" opacity=".35"/>
</g>
<circle cx="200" cy="160" r="8" fill="#aeb6bf" stroke="#6b737b" stroke-width="1.5"/>
<circle cx="198" cy="158" r="3" fill="#fff" opacity=".8"/>
</svg>
