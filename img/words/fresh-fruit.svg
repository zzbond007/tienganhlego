<radialGradient id="fresh-fruit-apple" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ff7b6b"/><stop offset=".6" stop-color="#d62828"/><stop offset="1" stop-color="#8a1010"/></radialGradient>
