<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="ladybird-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f9ec"/><stop offset="1" stop-color="#dcebcf"/></linearGradient>
<linearGradient id="ladybird-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd46a"/><stop offset="1" stop-color="#3f8f2c"/></linearGradient>
<radialGradient id="ladybird-shell" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".6" stop-color="#e01e1e"/><stop offset="1" stop-color="#8f0d0d"/></radialGradient>
<radialGradient id="ladybird-sh"><stop offset="0" stop-color="#1d4a12" stop-opacity=".45"/><stop offset="1" stop-color="#1d4a12" stop-opacity="0"/></radialGradient>
</defs>
