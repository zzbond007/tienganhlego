<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="bug-hotel-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f2fb"/><stop offset=".75" stop-color="#eef5e4"/><stop offset=".75" stop-color="#8fc062"/><stop offset="1" stop-color="#6a9a3e"/></linearGradient>
<linearGradient id="bug-hotel-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a2b"/><stop offset=".5" stop-color="#b98450"/><stop offset="1" stop-color="#7a4a1f"/></linearGradient>
<linearGradient id="bug-hotel-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a1f"/><stop offset="1" stop-color="#4f2e12"/></linearGradient>
<radialGradient id="bug-hotel-log" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8c79a"/><stop offset=".7" stop-color="#c9975e"/><stop offset="1" stop-color="#6b4220"/></radialGradient>
<radialGradient id="bug-hotel-sh"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="300" fill="url(#bug-hotel-bg)"/>
<ellipse cx="200" cy="270" rx="140" ry="12" fill="url(#bug-hotel-sh)"/>
<!-- legs -->
<rect x="112" y="250" width="14" height="22" fill="#5e3a18"/><rect x="274" y="250" width="14" height="22" fill="#5e3a18"/>
<!-- frame -->
<path d="M100 100 L200 40 L300 100 L300 254 L100 254Z" fill="url(#bug-hotel-wood)"/>
<path d="M114 106 L200 56 L286 106 L286 240 L114 240Z" fill="#3b2412"/>
<!-- shelves -->
<rect x="114" y="140" width="172" height="8" fill="url(#bug-hotel-wood)"/>
<rect x="114" y="192" width="172" height="8" fill="url(#bug-hotel-wood)"/>
<rect x="196" y="140" width="8" height="100" fill="url(#bug-hotel-wood)"/>
<!-- top: pine cones -->
<g fill="#8a5a2b" stroke="#5e3a18" stroke-width="1.5">
<ellipse cx="170" cy="118" rx="14" ry="20"/><ellipse cx="200" cy="112" rx="14" ry="22"/><ellipse cx="230" cy="118" rx="14" ry="20"/>
</g>
<g stroke="#5e3a18" stroke-width="1.5" fill="none"><path d="M158 112 l24 0 M158 122 l24 0 M188 104 l24 0 M188 116 l24 0 M218 112 l24 0 M218 124 l24 0"/></g>
<!-- left middle: bamboo tubes -->
<g><circle cx="132" cy="160" r="10" fill="#d9c27a"/><circle cx="154" cy="160" r="10" fill="#d9c27a"/><circle cx="176" cy="160" r="10" fill="#d9c27a"/><circle cx="143" cy="178" r="10" fill="#d9c27a"/><circle cx="165" cy="178" r="10" fill="#d9c27a"/><circle cx="187" cy="178" r="9" fill="#d9c27a"/></g>
<g fill="#2a1a0a"><circle cx="132" cy="160" r="5"/><circle cx="154" cy="160" r="5"/><circle cx="176" cy="160" r="5"/><circle cx="143" cy="178" r="5"/><circle cx="165" cy="178" r="5"/><circle cx="187" cy="178" r="4.5"/></g>
<!-- right middle: logs with holes -->
<g fill="url(#bug-hotel-log)"><circle cx="226" cy="168" r="18"/><circle cx="264" cy="168" r="18"/></g>
<g fill="#2a1a0a"><circle cx="220" cy="162" r="2.5"/><circle cx="230" cy="172" r="2.5"/><circle cx="224" cy="176" r="2"/><circle cx="260" cy="160" r="2.5"/><circle cx="270" cy="170" r="2.5"/><circle cx="262" cy="176" r="2"/></g>
<!-- left bottom: sticks/straw -->
<g stroke="#c9a15a" stroke-width="4"><path d="M118 206 L194 206 M118 214 L194 214 M118 222 L194 222 M118 230 L194 230"/></g>
<g stroke="#8a6a2a" stroke-width="2"><path d="M118 210 L194 210 M118 218 L194 218 M118 226 L194 226"/></g>
<!-- right bottom: bricks with holes -->
<rect x="208" y="204" width="74" height="32" fill="#c0573a"/>
<g fill="#5a1e10"><circle cx="222" cy="214" r="4"/><circle cx="240" cy="214" r="4"/><circle cx="258" cy="214" r="4"/><circle cx="270" cy="226" r="4"/><circle cx="232" cy="226" r="4"/><circle cx="250" cy="226" r="4"/></g>
<!-- roof -->
<path d="M84 106 L200 30 L316 106 L304 114 L200 48 L96 114Z" fill="url(#bug-hotel-roof)"/>
<!-- ladybird visitor -->
<g transform="translate(280 112)"><ellipse cx="0" cy="0" rx="9" ry="8" fill="#e53935"/><circle cx="-8" cy="0" r="4" fill="#111"/><circle cx="3" cy="-3" r="1.8" fill="#111"/><circle cx="3" cy="3" r="1.8" fill="#111"/></g>
</svg>
