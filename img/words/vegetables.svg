<radialGradient id="vegetables-tom" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ff7b6b"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#9b1b1b"/></radialGradient>
